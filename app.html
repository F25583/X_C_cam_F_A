<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AI Pro Video Enhancer & Magnifier</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* الشريط العلوي للأدوات */
        .top-bar { background: #1e1e1e; padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #333; z-index: 100; }
        .btn { background: #2d2d2d; color: white; border: 1px solid #444; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn:hover { background: #3d3d3d; border-color: #4CAF50; }
        .btn-primary { background: #4CAF50; border-color: #4CAF50; color: white; }
        .btn-primary:hover { background: #45a049; }
        
        /* منطقة العمل الرئيسية */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* شاشة عرض الفيديو */
        .video-container { flex: 1; background: #000; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { display: none; }
        canvas { max-width: 100%; max-height: 100%; transition: transform 0.05s ease-out; }

        /* لوحة التحكم الجانبية */
        .sidebar { width: 300px; background: #1a1a1a; border-right: 1px solid #333; padding: 15px; overflow-y: auto; z-index: 100; display: flex; flex-direction: column; gap: 15px; }
        .control-group { background: #242424; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .control-group h4 { color: #4CAF50; font-size: 13px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .slider-row { margin-bottom: 10px; }
        .slider-row label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: #ddd; }
        .slider-row span { color: #4CAF50; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4CAF50; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <label class="btn btn-primary">
            📁 فتح فيديو من الجهاز
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </label>
        <button class="btn" id="capture-btn">📺 التقاط نافذة أو شاشة</button>
        <button class="btn" id="reset-btn" style="margin-right: auto; color: #ff6b6b;">🔄 إعادة ضبط الكل</button>
    </div>

    <div class="workspace">
        <div class="video-container" id="video-container">
            <video id="main-video" controls autoplay playsinline></video>
            <canvas id="gl-canvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="control-group">
                <h4>🔍 الزوم والتحريك اليدوي</h4>
                <div class="slider-row">
                    <label>قوة التكبير (Zoom): <span id="z-val">1.0x</span></label>
                    <input type="range" id="zoom-slider" min="1" max="8" step="0.1" value="1">
                </div>
                <div class="slider-row">
                    <label>تحريك أفقي (X): <span id="x-val">0px</span></label>
                    <input type="range" id="pan-x-slider" min="-600" max="600" step="5" value="0">
                </div>
                <div class="slider-row">
                    <label>تحريك رأسي (Y): <span id="y-val">0px</span></label>
                    <input type="range" id="pan-y-slider" min="-600" max="600" step="5" value="0">
                </div>
            </div>

            <div class="control-group">
                <h4>✨ تحسين النقاء والإضاءة</h4>
                <div class="slider-row">
                    <label>منع التفكك البكسلي (Anti-Pixel): <span id="smooth-val">50%</span></label>
                    <input type="range" id="smooth-slider" min="0" max="100" step="5" value="50">
                </div>
                <div class="slider-row">
                    <label>شحذ الحواف (AI Sharp): <span id="sharp-val">+0%</span></label>
                    <input type="range" id="sharp-slider" min="0" max="15" step="0.5" value="0">
                </div>
                <div class="slider-row">
                    <label>مستوى الإضاءة: <span id="light-val">100%</span></label>
                    <input type="range" id="light-slider" min="30" max="300" step="5" value="100">
                </div>
            </div>

            <div class="control-group">
                <h4>🛠️ فلاتر التدقيق الجنائي</h4>
                <label class="checkbox-row">
                    <input type="checkbox" id="mono-check"> 🌓 وضع الأبيض والأسود عالي التباين
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" id="invert-check"> 👁️ وضع الرؤية العكسية (Invert)
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" id="flip-check"> 🔄 عكس الصورة أفقياً (Mirror)
                </label>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
